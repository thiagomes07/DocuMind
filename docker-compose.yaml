version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ocr-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ocruser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocrpass123}
      POSTGRES_DB: ${POSTGRES_DB:-ocr_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocruser} -d ${POSTGRES_DB:-ocr_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ocr-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocr-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production # ou development se quiser hot-reload (veja nota abaixo)
      PORT: 4000
      # Conexão com o container do banco
      DATABASE_URL: postgresql://${POSTGRES_USER:-ocruser}:${POSTGRES_PASSWORD:-ocrpass123}@postgres:5432/${POSTGRES_DB:-ocr_db}
      
      # JWT & Security
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      
      # AWS S3 & Bedrock
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID}
      
      # Limits
      MAX_DOCUMENTS_PER_USER: ${MAX_DOCUMENTS_PER_USER}
      MAX_TOKENS_PER_USER: ${MAX_TOKENS_PER_USER}
      
      # Frontend
      FRONTEND_URL: ${FRONTEND_URL}
      
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ocr-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Next.js precisa dessas vars no tempo de BUILD (npm run build)
        NEXT_PUBLIC_API_URL: http://localhost:4000/api 
        NEXT_PUBLIC_MAX_DOCUMENTS: ${MAX_DOCUMENTS_PER_USER}
        NEXT_PUBLIC_MAX_TOKENS: ${MAX_TOKENS_PER_USER}
        NEXT_PUBLIC_MAX_FILE_SIZE: ${MAX_FILE_SIZE_MB}
    container_name: ocr-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ocr-network

  nginx:
    build:
      context: ./backend
      dockerfile: nginx/Dockerfile
    container_name: ocr-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - ocr-network
    volumes:
      - nginx_logs:/var/log/nginx

volumes:
  postgres_data:
  nginx_logs:

networks:
  ocr-network:
    driver: bridge