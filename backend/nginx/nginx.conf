# Configuração de rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=3r/m;

# Upstream do backend
upstream nestjs_backend {
    server backend:4000;
    keepalive 32;
}

# Upstream do frontend
upstream nextjs_frontend {
    server frontend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    
    # Aumentar buffer size para uploads
    client_max_body_size 10M;
    client_body_buffer_size 10M;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ===== BACKEND API =====
    location /api {
        # Rate limiting (padrão)
        limit_req zone=api_limit burst=10 nodelay;
        
        proxy_pass http://nestjs_backend;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Cookies
        proxy_cookie_path / /;
        proxy_cookie_domain localhost $host;
    }
    
    # Rate limit especial para auth
    location ~ ^/api/auth/(register|login) {
        limit_req zone=auth_limit burst=2 nodelay;
        
        proxy_pass http://nestjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Rate limit especial para upload
    location /api/documents/upload {
        limit_req zone=upload_limit burst=1 nodelay;
        
        proxy_pass http://nestjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout maior para uploads
        proxy_read_timeout 300s;
    }
    
    # Health check (sem rate limit)
    location /api/health {
        proxy_pass http://nestjs_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # Swagger docs (sem rate limit)
    location /api/docs {
        proxy_pass http://nestjs_backend/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ===== FRONTEND =====
    location / {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
    }
    
    # Next.js static files (cache agressivo)
    location /_next/static {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Next.js images
    location /_next/image {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_cache_valid 200 1h;
    }
}